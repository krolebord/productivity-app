minimumReleaseAge: 10080
# eslint 10.6.0 is already in the lockfile; it fails the age check on re-resolution until 2026-07-03
minimumReleaseAgeExclude:
  - eslint
trustPolicy: no-downgrade
# workbox-build (via vite-plugin-pwa) pulls these: the off-main-thread fork is
# referenced by GoogleChrome/workbox itself but published without provenance;
# semver@6.3.1 is a 2023 backport flagged only because 7.x provenance predates it.
trustPolicyExclude:
  - "@trickfilm400/rollup-plugin-off-main-thread"
  - semver@6.3.1
