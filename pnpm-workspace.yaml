packages:
  - apps/*
  - packages/*

catalog:
  "@sqlite-sync/core": ^0.13.2
  "@sqlite-sync/react": ^0.13.2
  "@sqlite-sync/react-native": ^0.13.2
  "@tanstack/react-form": ^1.33.5
  date-fns: ^4.4.0
  kysely: ^0.28.10
  zod: ^4.6.5
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  tailwindcss: ^4.3.3
  "@types/node": ^26.6.4
  "@orpc/client": ^1.15.4
  "@orpc/contract": ^1.15.4
  "@orpc/server": ^1.15.4
  tsx: ^4.23.15
  typescript: ^7.0.2
  vitest: ^4.1.11

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - eslint
  - "@sqlite-sync/ai"
  - "@sqlite-sync/cloudflare"
  - "@sqlite-sync/core"
  - "@sqlite-sync/devtools"
  - "@sqlite-sync/react"
  - "@sqlite-sync/react-native"
