<!doctype html>
<html lang="en" class="dark">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Productivity</title>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<link rel="icon" href="/favicon.ico" sizes="32x32">
	<link rel="apple-touch-icon" href="/apple-touch-icon.png">
	<script>
		// Apply the persisted theme before first paint to avoid a flash.
		// Reads the zustand persist entry written by src/lib/theme-store.ts.
		(() => {
			var theme;
			try {
				theme = JSON.parse(localStorage.getItem("productivity-theme")).state.theme;
			} catch (_) { }
			var dark = theme === "light"
				? false
				: theme === "dark"
					? true
					: window.matchMedia("(prefers-color-scheme: dark)").matches;
			document.documentElement.classList.toggle("dark", dark);
		})();
	</script>
	<script>
		// A precached shell can outlive the chunks it references, leaving a blank page on every
		// launch. When the entry module graph fails to load, drop the service worker and its
		// caches, then reload from the network. A lazy chunk missing after a service worker
		// update only needs a reload. The timestamp guard prevents a reload loop.
		(() => {
			var key = "productivity-shell-recovery-at";
			var claimReload = () => {
				try {
					if (Date.now() - Number(sessionStorage.getItem(key)) < 60000) return false;
					sessionStorage.setItem(key, String(Date.now()));
					return true;
				} catch (_) {
					return false;
				}
			};
			window.addEventListener("error", (event) => {
				var script = event.target;
				if (!(script instanceof HTMLScriptElement) || script.type !== "module") return;
				if (!claimReload()) return;
				Promise.all([
					navigator.serviceWorker?.getRegistrations().then((registrations) =>
						Promise.all(registrations.map((registration) => registration.unregister()))
					),
					window.caches?.keys().then((names) => Promise.all(names.map((name) => caches.delete(name)))),
				]).finally(() => location.reload());
			}, true);
			window.addEventListener("vite:preloadError", (event) => {
				if (!claimReload()) return;
				event.preventDefault();
				location.reload();
			});
		})();
	</script>
</head>

<body class="min-h-dvh font-sans scroll-smooth antialiased">
	<div id="root" class="min-h-dvh"></div>
	<script type="module" src="/src/main.tsx"></script>
</body>

</html>
